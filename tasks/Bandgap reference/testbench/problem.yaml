derived_metrics:
  TC_19_120_ppm_C:
    expression: 1e6 * s / (v * 101)
    unit: ppm/C
    inputs:
      s:
        metric: Vref_spread_19_120_V
        recipe: bgr1111_temperature_v1
      v:
        metric: Vref_V
        recipe: bgr1111_nominal_v1
    provenance: 'replay extractor.py / measurements.json: 1e6*(ymax - ymin of Vref over 19..120 C)/(Vref at the condition''s nominal dc op * (120
      - 19)); paper Eq. 3 over the 19..120 C interval of Sec. III-A'
  Startup_qualification:
    expression: max(abs(m - 1.2) / 0.12, p / 0.001, abs(m - v) / abs(v) / 0.01)
    unit: normalized error
    inputs:
      m:
        metric: Startup_tail_mean_V
        recipe: bgr1111_startup_v1
      p:
        metric: Startup_tail_vpp_V
        recipe: bgr1111_startup_v1
      v:
        metric: Vref_V
        recipe: bgr1111_nominal_v1
    provenance: 'replay extractor.py / measurements.json: max(|tail mean - 1.2|/0.12, tail ripple/1 mV, |tail mean - dc Vref|/|dc Vref|/1 %) over
      0.9..1 ms of the 0 -> VS power-up'
