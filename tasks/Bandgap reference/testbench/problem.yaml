description: 'Benchmark task (docs/benchmark_rules.md), converted 2026-11-11 from the fixed replay pack of this circuit. 1.2 V all-CMOS bandgap
  reference of the ICICM 2025 paper (Fig. 3 core + Fig. 4 two-stage PMOS-input op-amp), sky130 01v8, binned SkyWater models. Conditions = the
  replay''s 15: process tt/ff/ss/sf/fs x supply 1.71 / 1.80 / 1.89 V at 27 C (nominal tt 1.80 V). Fixture and measurements = the replay decks
  and extractor.py (recipes/bgr1111_ext.py): nominal deck (dc op Vref, 1 Hz PSRR, 30 us average power), -40..120 C temperature sweep (TC over
  19..120 C), 1.71..1.89 V line sweep, 0 -> VS start-up transient without nodeset. Targets = exactly the replay pack''s targets.json limits (owner-approved),
  at all 15 conditions. No objective, no Monte Carlo (the replay has no statistical target).'
source:
  title: Design of a Bandgap Voltage Reference for an 8-bit SAR-ADC for Powerline Monitoring using SKY130 PDK (ICICM 2025, DOI 10.1109/ICICM66614.2025.11315948)
  figure: 'Fig. 3 (bandgap core: PMOS mirror M1-M3, CTAT diode NMOS M4, PTAT diode NMOS M5 (10 units), R1-R3) and Fig. 4 (PMOS-input two-stage
    op-amp: input pair M10/M11, NMOS mirror load M12/M13, tail M7 biased by M6 + R4, second stage M9 with PMOS load M8, Miller capacitor CC)'
