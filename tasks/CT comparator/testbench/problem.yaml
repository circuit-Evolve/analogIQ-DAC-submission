schema: analogiq.sizing_problem/1
task_id: ccmp_lelo_task_001
topology_id: ccmp_lelo
family: ct_comparator
technology_id: sky130
parameterization_id: ccmp_lelo_p1
execution_profile: search_full
description: 'LELOTEMP_CCMP (wulffern/lelo_temp_sky130a, commit e439fe6): timing comparator of the relaxation oscillator: a continuous-time two-stage
  comparator with a 5-unit MIM integrating capacitor, reset NMOS and power-down clamp. Test = the repository''s tran testbench (sim/LELOTEMP_CCMP/tran.spi,
  tran.meas): ibias 1 uA charges the integrating node after RST releases at 200 ns, threshold VC = 0.75 V, 600 ns window. Targets = the documented
  simulated results (typical, min/max over the 12 process x supply corners, Monte Carlo mean / 3-sigma-derived sigma); the repository''s spec
  rows are not used (documented results exist for every metric). Variables: 6 tied transistor groups (W per finger, L, fingers) + the MIM unit
  W, L.'
source:
  title: 'lelo_temp_sky130a LELOTEMP_CCMP: timing comparator of the relaxation oscillator (repository documentation and simulation summaries;
    commit e439fe6)'
  doi: 'none (repository: https://github.com/wulffern/lelo_temp_sky130a)'
  figure: schematics/01_LELOTEMP_CCMP.png, 02_LELOTEMP_CMP.png (xschem renders of LELOTEMP_CCMP.sch / LELOTEMP_CMP.sch)
