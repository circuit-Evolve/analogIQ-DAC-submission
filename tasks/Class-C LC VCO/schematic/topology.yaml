schema_version: 1
topology_id: lcvco24_sheikhahmadi
family: oscillator
interface_type: differential_lc_vco
technology_id: sky130
approval_status: unapproved
source:
  doi: 10.1109/TCSII.2020.3005251
  title: "Sheikhahmadi, Moezzi, Ghafoorifard, 'A Low Phase Noise Class-C Oscillator With Improved Resonator and Robust Start-Up', IEEE TCAS-II 68(1):92-96, Jan 2021"
  figure: "Fig. 5 (class-C core M1/M2 with CB/RB gate bias, tail MT with CT, improved coupled-inductor resonator, auxiliary class-B start-up pair M3/M4 + MT1 switched by the comparator output VCOM); sizes: Fig. 5 inset"
  netlist_origin: final.scs
  inputs: "source/ (paper PDF, metrics.xlsx, operating_conditions.xlsx, pvt_corners.xlsx, FINAL_MAIN_SCHEMATIC.png; see source/ORIGIN.txt)"
  modifications:
    - "Paper-fidelity fix 2026-10-27: inductor loss. A series resistor R = 2 pi f0 L / Q (f0 = 3.4 GHz, Q = 10) is added in each of the four inductor branches (LP, LN, LAP, LAN; devices RLP, RLN, RLAP, RLAN, dependent parameters R_ESR_MAIN / R_ESR_AUX = 3.42 ohm at 1.6 nH). Evidence: the paper states Q = 10 for its resonator simulations (Sec. II-III, Figs. 3 and 4(a): 'Assuming Q = 10, the resonant frequency of 3.5 GHz') and models the inductors with a series resistance R (Eq. 5); it gives no other design-inductor Q (the post-layout results use the foundry inductor). Reference bias V_BIAS re-chosen 0.7 -> 0.85 V (D7: the ideal-inductor bias stopped oscillating at TT / SS with the loss)."
    - "dut_benchmark.scs = final.scs plus one added top-level line `parameters W_CORE W_AUX W_MT1 W_MT` declaring the per-finger widths bound by variables.yaml (sky130 netlist width = W per finger x nf, owner rule 2026-10-24; same mechanism as the mixer packages); no device or value changed. The paper's 130 nm circuit is the exporter's sky130 netlist (standard 01v8 devices, L = 0.15 / 0.35 um); rule D7 applies (supply chosen within the 1.95 V device rating, biases re-chosen by simulation and made sizing variables)."
dut:
  netlist: dut_benchmark.scs
  subckt_name: repaired_core
  port_order: [VDD, VSS, VBIAS, VTAIL, VCOM, CMP_SENSE, OUTP, OUTN, AUXP, AUXN]
  net_map: {}
ports:
  output_positive: OUTP
  output_negative: OUTN
  supply_positive: VDD
external_bias:
  VSS: {kind: voltage, value: 0.0, provenance: "benchmark rule G3: ground pin without a family role driven by a 0 V source"}
  VBIAS: {kind: voltage, value: 0.7, provenance: "paper Fig. 5: gate bias of M1/M2 not reported; sizing variable V_BIAS (curator reference 0.85 V by simulation with the Q = 10 inductor loss, D7; 0.7 V before the loss was added)"}
  VTAIL: {kind: voltage, value: 0.9, provenance: "paper Fig. 5: tail gate bias not reported; sizing variable V_TAIL (curator reference 0.9 V by simulation, D7)"}
  VCOM: {kind: voltage, value: 0.0, provenance: "paper Fig. 7: the comparator output VCOM falls to ~0 V within ~20 ns once the oscillation has built up, switching the auxiliary class-B pair off; the comparator is not in the netlist, so the steady state (aux pair off) is VCOM = 0 V; the start-up condition sets it to the supply"}
open_pins:
  CMP_SENSE: "internal source node of M1/M2 (tail node, CT / MT drain) exported as a port because the missing comparator senses it (paper Fig. 5, Vs ~ 0.2 V in Fig. 7)"
  AUXP: "internal drain node of the auxiliary class-B pair M3 (LAP, C1P) exported as a port by the schematic exporter"
  AUXN: "internal drain node of the auxiliary class-B pair M4 (LAN, C1N) exported as a port by the schematic exporter"
probes: []
op_check:
  exclude: [M3, M4, MT1, MT]
  note: >-
    G8 is checked at the DC equilibrium (osc_dc_v1, kept for LC oscillators by the owner 2026-10-23). Excluded: the
    auxiliary class-B start-up pair M3/M4 and its tail MT1, which the comparator output (VCOM = 0 V) switches off in the
    steady state (paper Sec. III, Fig. 7: off by design). Also excluded (curator_choice): the class-C tail MT: M1/M2 are biased below threshold (class-C), so at the DC equilibrium they carry ~no current and the tail sits at Vds ~ 10 mV (triode); it is a current source only while the oscillation conducts (paper Fig. 7: Vs ~ 0.2 V).
known_issues:
  - "The paper gives no tuning mechanism (fixed frequency) and no supply, biases or temperature for the nominal case: Fig. 9 shows 1.0 / 1.2 / 1.4 V and TT 25 C, FF -20 C, SS 75 C; the nominal supply 1.2 V is a curator choice."
  - "The comparator of the robust start-up circuit (Vref, Vbias, Vtail values not reported) is not in the netlist; its output is the pin VCOM (0 V steady state; the start-up time is measured with VCOM at the supply, see onboarding_status)."
  - "Paper results are post-layout simulations; the testbench simulates the schematic with ideal inductors (no Q given for the design inductor) on sky130 instead of the paper's unnamed 130 nm process."
  - "Phase noise inconsistencies in the paper text: Fig. 4(b) ~-129.5 dBc/Hz at 1 MHz, Fig. 9 ~-127; Table I -136.8 dBc/Hz at 3 MHz is the summary value used (G6)."
