    type: instance_parameter
    instances:
    - C2P
    - C2N
    parameter: c
- name: C_BIAS
  kind: real
  unit: F
  lower: 1.0e-14
  upper: 1.0e-10
  scale: log
  start: 1.0e-12
  quantity: capacitance
  role: CB = CBP = CBN gate coupling capacitors
  binding:
    type: instance_parameter
    instances:
    - CBP
    - CBN
    parameter: c
- name: R_BIAS
  kind: real
  unit: ohm
  lower: 10.0
  upper: 1000000.0
  scale: log
  start: 10000.0
  quantity: resistance
  role: RB = RBP = RBN gate bias resistors
  binding:
    type: instance_parameter
    instances:
    - RBP
    - RBN
    parameter: r
- name: C_FILT
  kind: real
  unit: F
  lower: 1.0e-14
  upper: 1.0e-10
  scale: log
  start: 1.0e-12
  quantity: capacitance
  role: CF comparator filter capacitor (VCOM to VSS)
  binding:
    type: instance_parameter
    instances:
    - CF
    parameter: c
- name: C_TAIL
  kind: real
  unit: F
  lower: 1.0e-14
  upper: 1.0e-10
  scale: log
  start: 1.0e-12
  quantity: capacitance
  role: CT tail capacitor (class-C source node to VSS)
  binding:
    type: instance_parameter
    instances:
    - CT
    parameter: c
- name: V_BIAS
  kind: real
  unit: V
  lower: 0.0
  upper: 1.2
  scale: lin
  start: 0.6
  quantity: bias_voltage
  role: class-C gate bias VBIAS (through RB to the M1/M2 gates; not reported by the paper)
  binding:
    type: external_bias
    pin: VBIAS
- name: V_TAIL
  kind: real
  unit: V
  lower: 0.0
  upper: 1.2
  scale: lin
  start: 0.6
  quantity: bias_voltage
  role: tail gate bias VTAIL (sets the class-C tail current; not reported by the paper)
  binding:
    type: external_bias
    pin: VTAIL
dependent_parameters:
  R_ESR_MAIN:
    expression: 2*3.14159265*3.4e9*L_MAIN/10
    role: 'series loss of each main inductor LP / LN, R = 2 pi f0 L / Q with f0 = 3.4 GHz and Q = 10 (paper Secs. II-III: ''Assuming Q = 10'';
      Eq. (5) series resistance R)'
    binding:
      type: instance_parameter
      instances:
      - RLP
      - RLN
      parameter: r
  R_ESR_AUX:
    expression: 2*3.14159265*3.4e9*LI_AUX/10
    role: series loss of each auxiliary inductor LAP / LAN, R = 2 pi f0 L / Q with f0 = 3.4 GHz and Q = 10 (same Q as the main inductors)
    binding:
      type: instance_parameter
      instances:
      - RLAP
      - RLAN
      parameter: r
  W_CORE_TOTAL:
    expression: W_CORE*NF_CORE
    role: M1 total width = per-finger width W_CORE x fingers NF_CORE (SKY130 bins on width per finger; owner 2026-10-24)
    binding:
      type: instance_parameter
      instances:
      - M1
      - M2
      parameter: w
  W_AUX_TOTAL:
    expression: W_AUX*NF_AUX
    role: M3 total width = per-finger width W_AUX x fingers NF_AUX (SKY130 bins on width per finger; owner 2026-10-24)
    binding:
      type: instance_parameter
      instances:
      - M3
      - M4
      parameter: w
  W_MT1_TOTAL:
    expression: W_MT1*NF_MT1
    role: MT1 total width = per-finger width W_MT1 x fingers NF_MT1 (SKY130 bins on width per finger; owner 2026-10-24)
    binding:
      type: instance_parameter
      instances:
      - MT1
      parameter: w
  W_MT_TOTAL:
    expression: W_MT*NF_MT
    role: MT total width = per-finger width W_MT x fingers NF_MT (SKY130 bins on width per finger; owner 2026-10-24)
    binding:
      type: instance_parameter
      instances:
      - MT
      parameter: w
