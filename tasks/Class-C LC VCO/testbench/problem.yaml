schema: analogiq.sizing_problem/1
task_id: lcvco24_sheikhahmadi_task_001
topology_id: lcvco24_sheikhahmadi
family: oscillator
technology_id: sky130
parameterization_id: lcvco24_sheikhahmadi_p1
execution_profile: search_full
description: 'Benchmark task (docs/benchmark_rules.md). 3.4 GHz class-C cross-coupled LC oscillator with the improved coupled-inductor resonator
  and the auxiliary class-B start-up pair (paper Fig. 5), the 130 nm paper circuit as the exporter''s sky130 netlist (rule D7): nominal TT, 25
  C, 1.2 V (the paper shows 1.0 / 1.2 / 1.4 V, nominal not stated: curator choice), 10 fF per output. Conditions: nominal, and the paper''s Fig.
  9 PVT combinations TT 25 C / FF -20 C / SS 75 C at 1.0 / 1.2 / 1.4 V (9 in all), plus a start-up condition with the comparator output VCOM held
  at the supply (auxiliary pair on). Phase noise, FoM and power from autonomous PSS + pnoise (steady state: aux pair off, VCOM = 0 V). Targets
  are the paper''s post-layout values with 10 % linear tolerance, each where the paper reports it. No Monte Carlo (the paper reports none). G8
  at the DC equilibrium (owner 2026-10-23 for LC oscillators), the off-by-design auxiliary pair excluded.'
source:
  doi: 10.1109/TCSII.2020.3005251
  title: Sheikhahmadi, Moezzi, Ghafoorifard, 'A Low Phase Noise Class-C Oscillator With Improved Resonator and Robust Start-Up', IEEE TCAS-II
    68(1):92-96, Jan 2021
  figure: 'Fig. 5 (class-C core M1/M2 with CB/RB gate bias, tail MT with CT, improved coupled-inductor resonator, auxiliary class-B start-up pair
    M3/M4 + MT1 switched by the comparator output VCOM); sizes: Fig. 5 inset'
