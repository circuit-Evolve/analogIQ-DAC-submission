description: 'DTMOS MOS-C current-mode fractional-order high-pass filter (IEMECON 2025, Fig. 1(b), gpdk180, +-0.9 V). Shared analogiq benchmark
  version of the 10_11_26 replay task: the replay''s 12 conditions (nominal NN 27 C +-0.9 V; FF/FS/SF/SS; rails +-0.7/0.8/1.0/1.1 V; -27/0/100
  C, one at a time), its fixture (ideal current drive into IN, OUT held at 0 V by a voltage source that senses the output current) and its four
  retained metrics as targets with exactly the replay targets.json limits (owner-approved paper targets with a 15 % allowance; not re-derived
  with the 10 % rule), each at every condition (replay scope). Rule G8 gate on the AC deck''s DC point (nominal). No Monte Carlo (the replay has
  no Monte Carlo target; the paper''s Fig. 6 Monte Carlo spreads are not targeted). No objective. User decision 2026-11-12: validity gates are
  bypassed for task eligibility/feasibility; all performance constraints remain enforced. Diagnostics are not a gate pass or physical qualification.'
source:
  title: A New DTMOS MOS-C Implementation of Fractional-Order Low-Voltage Low-Power Differentiator/High-Pass Filter (Kumar, Aggarwal, Gupta, Dabi,
    Gupta; IEMECON 2025)
  doi: 10.1109/IEMECON69302.2025.11365732
  figure: Fig. 1(b) (17-MOS core with DTMOS bias circuitry Mpb1-Mpb4), Table I (device W/L groups)
