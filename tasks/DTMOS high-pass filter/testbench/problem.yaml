operating_conditions:
  supply_V:
    value: 0.9
    provenance: 'paper Sec. III and Table II: VDD/VSS = +-0.9 V; replay corners.json rails_V [-0.9, 0.9] (nominal); the 0.7-1.1 V corners scale
      both rails'
  supply_negative_V:
    value: -0.9
    provenance: 'paper Sec. III: VSS = -0.9 V; scaled with the supply corners (scale_supply_negative)'
  output_voltage_V:
    value: 0.0
    provenance: 'replay decks: VOUT_SENSE (OUT 0) vsource dc=0 (corners.json output_clamp_V 0): the output current flows into an ideal 0 V termination'
  input_frequency_Hz:
    value: 500.0
    provenance: 'paper Sec. III.A: 500 Hz sinusoidal input current; replay IIN_SRC freq=500'
  input_peak_to_peak_A:
    value: 1.0e-05
    provenance: 'paper Sec. III.A: peak-to-peak amplitude 10 uA; replay IIN_SRC ampl=5u'
  input_dc_A:
    value: 0.0
    provenance: replay IIN_SRC sinedc=0 (corners.json input_dc_A 0); the paper gives no input DC current
constraints:
- name: power
  metric: quiescent_power_W
  recipe: hpf1111_iac_v1
  point: {}
  unit: W
  lower: 0.0
  upper: 0.0005456
  target:
    kind: linear
  conditions: all
  aggregate: worst case over all conditions and matching points
  provenance: 'replay targets.json HPF_Rail_power_mW [0, 0.5456] mW at all 12 conditions (paper abstract and Table II: 0.496 mW; owner-approved
    lower-is-better direction with the original upper tolerance, 0.496 x 1.1). Definition = replay: 1000*|rail|*(-I(VDD_SRC:p)+I(VSS_SRC:p)) at
    the DC point, here -V(vdd)*I(VSUP) - V(vss)*I(VNEG) in W'
  source: native
- name: thd
  metric: thd_pct
  recipe: hpf1111_ithd_v1
  point: {}
  unit: '%'
  lower: 0.0
  upper: 6.0
  target:
    kind: linear
  conditions: all
  aggregate: worst case over all conditions and matching points
  provenance: 'replay targets.json THD_500Hz_10uApp_percent [0, 6) % at all 12 conditions (paper Sec. III.A and Conclusion: THD < 6 %); the replay''s
    bound is exclusive (< 6), analogiq limits are inclusive (<= 6): differs only at exactly 6 %. Definition = replay: 500 Hz, 10 uA peak-to-peak
    input current, tran 60 ms, FFT of the output current over 40-60 ms at 2 us, harmonics 2..20'
  source: native
- name: cutoff
  metric: cutoff_frequency_Hz
  recipe: hpf1111_iac_v1
  point: {}
  unit: Hz
  lower: 180.0
  upper: 220.0
  target:
    kind: linear
  conditions: all
  aggregate: worst case over all conditions and matching points
  provenance: 'replay targets.json HPF_cutoff_Hz [180, 220] Hz at all 12 conditions (200 Hz target specified by the user/owner; paper Fig. 5 /
    6(b) cut-off spreads). Definition = replay qualified rising half-power crossing: reference = gain at 6.3246 kHz (centre of 2-20 kHz), passband
    flat within 1 dB, gain at 1 Hz below the half-power level, first rising crossing at or below 2 kHz'
  source: native
- name: gain_200Hz
