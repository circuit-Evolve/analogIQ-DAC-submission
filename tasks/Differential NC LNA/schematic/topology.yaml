external_bias:
  VSS: {kind: voltage, value: 0.0, provenance: "rule G3: ground pin without a family role driven by a 0 V source"}
  Vbn: {kind: voltage, value: 1.29, provenance: "paper: design rule (v), PDF p. 88: Vbn = Vdd/2 + VGS,opt with VGS,opt ~ 540 mV (PDF p. 87) -> 1.29 V at 1.5 V. The low-noise-mode value is not given numerically (Fig. 4.7 only); a sizing variable (D14), this value is the curator's reference check only; reference_candidate.json now uses Vbn 1.5 V (see reference_audit_2026_10_26)"}
  Vbp: {kind: voltage, value: 0.21, provenance: "paper: design rule (v), PDF p. 88: Vbp = Vdd/2 - VGS,opt -> 0.21 V at 1.5 V; sizing variable (D14), curator reference check only; reference_candidate.json now uses Vbp 0.0 V"}
dut_parameters:
  CL: {value: 2.0e-13, provenance: "owner answer DS2a: CL (output-buffer input capacitance, undeclared in final.scs) fixed at 200 fF (test load)"}
op_check:
  note: "All four common-gate devices are meant to operate in saturation (thesis Sec. 4.2); no exclusions."
known_issues:
  - "Fully differential DUT: measured with the lna_diff_* recipes (recipes/lna_ext.py): ideal balun from a single-ended 100-ohm port (50 ohm per side, the thesis's TCM2-33X+ 1:2 baluns, PDF p. 89), ideal 1-uF input DC blocks (vip/vin are self-biased at the nMOS/pMOS current balance), outputs open apart from CL (the thesis's high-impedance common-drain buffers, de-embedded) with noiseless 1-Gohm DC returns (vop/von reach the circuit only through Co/CL)."
  - "Low-noise mode only (owner answer DS1b): 800 uA from 1.5 V (1.2 mW). The thesis gives the bias of this mode only graphically (Fig. 4.7); Vbn/Vbp are sizing variables."
  - "All targets are measured values (Table 4.1, PDF p. 92; text PDF p. 89-91); the thesis gives simulated curves (Fig. 4.10) but no simulated numbers."
  - "S22 and the stability factor K were measured with the output buffers and are not covered (owner answer DS4a)."
