  title: "Investigations on Noise Cancellation and Linearity Improvement in Low Power LNAs and Receivers (I. Das, PhD thesis, IIT Guwahati, 2021), Chapter 4: low-power partial noise-canceling complementary common-gate LNA"
  figure: "Fig. 4.3(a) (fully differential CCG LNA: stacked nMOS/pMOS common-gate pairs M1n,p / M2n,p, capacitor cross-coupling Cc/Rc, loads RL, output combining Co, buffer-input load CL) and its values table Fig. 4.3(b) (PDF p. 82); test setup Fig. 4.9 (PDF p. 89)"
  netlist_origin: final.scs
  inputs: "source/ (thesis PDF, schematic figure, test-setup figure, metrics_sizing.xlsx, operating_conditions.xlsx, pvt_corners.xlsx; see source/ORIGIN.txt)"
