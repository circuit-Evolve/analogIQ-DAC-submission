schema_version: 1
topology_id: gbfc21
family: amplifier
interface_type: differential_input_differential_output
technology_id: gpdk180
approval_status: unapproved
source:
  doi: 10.1109/ISIE45552.2021.9576208
  title: "Sarkar, Ghosh, Chatterjee: Design of a 2 mW Power, 112 dB Gain-Boosted, Folded Cascode Amplifier in 0.18 um Process (IEEE ISIE 2021)"
  figure: "Fig. 1 (p. 1, main PMOS-input folded cascode with CMFB and the N-input / P-input auxiliary amplifiers), Fig. 3 (P-input auxiliary), Fig. 5 (N-input auxiliary)"
  netlist_origin: final.scs
  inputs: "source/ (paper PDF, Paper5_Metrics.xlsx, Paper5_Corners.xlsx, Fig. 5 PNG; see source/ORIGIN.txt)"
  modifications:
    - "None. final.scs is the dataset team's 2026-10-28 re-export (DAC-dataset commit 03466f5, 'Fixed issue'); it holds the complete circuit: the main amplifier (Mp1-Mp13, Mn1-Mn4, Mn9, Mn10 incl. the CMFB), the N-input auxiliary amplifier (N_*) and the P-input auxiliary amplifier (P_*); the earlier export (2026-10-24) held only an auxiliary amplifier (kept in _superseded/2026-10-28/). Every device size equals the paper's figure label (onboarding_status.yaml netlist_check_2026_10_28)."
dut:
  netlist: final.scs
  subckt_name: gbfc21_dut
  port_order: [VDD, VSS, VINM, VINP, VOUTM, VOUTP, VCM, Vb1, N_VB1, N_VB2, N_VB3, N_VB4, P_VB1, P_VB2, P_VB3, P_VB4]
  net_map: {}
ports:
  input_positive: VINP        # Mp12 gate (PMOS pair): VINP up -> Mp12 current down -> VOUTP down, VOUTM up (checked by simulation)
  input_negative: VINM        # Mp11 gate
  output: VOUTM               # non-inverting output (follows VINP - VINM)
  output_negative: VOUTP
  supply_positive: VDD
  supply_negative: VSS
  output_common_mode_reference: VCM   # gates of the CMFB reference devices Mp8/Mp9
external_bias:
  Vb1: {kind: current_reference, device: pmos1, w_m: 1.8e-05, l_m: 1.8e-07, value: 6.79e-05, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): main PMOS gate bias (gates of Mp1/Mp2/Mp5/Mp6/Mp13) generated by a current-fed diode-connected pmos1 18/0.18 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  N_VB1: {kind: current_reference, device: pmos1, w_m: 1.8e-06, l_m: 1e-06, value: 1.17e-06, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): N-aux PMOS top sources generated by a current-fed diode-connected pmos1 1.8/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  N_VB2: {kind: current_reference, device: pmos1, w_m: 5e-07, l_m: 1e-06, value: 1.47e-06, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): N-aux PMOS cascode gates generated by a current-fed diode-connected pmos1 0.5/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  N_VB3: {kind: current_reference, device: nmos1, w_m: 5e-07, l_m: 1e-06, value: 2.02e-05, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): N-aux NMOS cascode gates generated by a current-fed diode-connected nmos1 0.5/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  N_VB4: {kind: current_reference, device: nmos1, w_m: 9e-07, l_m: 1e-06, value: 1.64e-06, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): N-aux NMOS sinks and tail generated by a current-fed diode-connected nmos1 0.9/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  P_VB1: {kind: current_reference, device: pmos1, w_m: 2.41e-06, l_m: 1e-06, value: 2.07e-06, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): P-aux PMOS top sources and tail generated by a current-fed diode-connected pmos1 2.41/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  P_VB2: {kind: current_reference, device: pmos1, w_m: 5e-07, l_m: 1e-06, value: 2.58e-06, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): P-aux PMOS cascode gates generated by a current-fed diode-connected pmos1 0.5/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  P_VB3: {kind: current_reference, device: nmos1, w_m: 5e-07, l_m: 1e-06, value: 2.39e-05, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): P-aux NMOS cascode gates generated by a current-fed diode-connected nmos1 0.5/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
  P_VB4: {kind: current_reference, device: nmos1, w_m: 3.4e-06, l_m: 1e-06, value: 7.82e-06, provenance: "curator choice (the paper prints no bias values: only unvalued branch currents I1/I2/I3 and ideal 'Vb' labels in Figs. 1, 3, 5): P-aux NMOS sinks generated by a current-fed diode-connected nmos1 3.4/1 um (testbench element, as a mirror bias generator: the bias voltage tracks process and temperature like the paper's corner results imply); the reference current is the sizing variable, initial value found by simulation so that the paper-size amplifier is biased with every device saturated and draws about the paper's 2.08 mW"}
op_check:
  exclude: [N_Mn5, N_Mn6, P_Mp7, P_Mp8]
  note: "N_Mn5/N_Mn6 (N-aux) and P_Mp7/P_Mp8 (P-aux) are the auxiliary amplifiers' CMFB summing devices (Figs. 3 and 5): their gates are the aux outputs and they act as variable (triode / edge) resistors in the tail path by design."
known_issues:
  - "The paper prints no bias values and no load capacitance: nine bias reference currents are curator-chosen sizing variables and CL is a curator choice (onboarding_status.yaml)."
