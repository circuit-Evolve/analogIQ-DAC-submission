schema_version: 1
topology_id: gmix04_patulea_2015
family: mixer
interface_type: double_balanced_active_mixer_upconverter
technology_id: sky130
approval_status: unapproved
source:
  doi: null
  title: "Wideband Up-Converting Mixer for Digital Communications Implemented in 130nm CMOS Technology (MASc thesis, G. Patulea, Carleton University, 2015)"
  figure: "Fig. 4.12 (PDF 99): one Gilbert cell of the I/Q up-converter (switching quad T1/T3/T8/T9, baseband pair T10/T11, tail T6, baseband bias divider RP0-RP3, decoupling CV0-CV2)"
  netlist_origin: final.scs
  inputs: "source/ (thesis PDF, figures, metrics_sizing.xlsx, operating_conditions.xlsx, pvt_corners.xlsx, cadence_schematic.png; see source/ORIGIN.txt)"
  modifications:
    - "dut_benchmark.scs = final.scs plus RD_P (VDD RF_P) and RD_N (VDD RF_N) at the thesis value (owner answer PT2a: the thesis's hand-calculated drain load, eq. 68 PDF 90; the chip's peaking inductors and active balun are not in the netlist). RD is the sizing variable R_D. 2026-10-24 (owner): plus a top-level `parameters W_SW W_BB W_T` line declaring the per-finger widths (variables.yaml). final.scs itself is unchanged."
    - "Devices: the thesis is IBM 130 nm (L = 120 nm); the dataset netlist uses sky130 01v8 nfets at L = 0.15 um with the thesis widths/fingers (rule D7: exported devices kept, biases re-chosen by simulation)."
dut:
  netlist: dut_benchmark.scs
  subckt_name: gmix04_dut
  port_order: [VDD, VSS, RF_P, RF_N, LO_P, LO_N, BB_P, BB_N, TAIL_BIAS]
  net_map: {}
ports:
  rf_input_positive: BB_P        # up-converter: the baseband input takes the family's RF-input role
  rf_input_negative: BB_N
  lo_positive: LO_P
  lo_negative: LO_N
  if_output_positive: RF_P       # ... and the RF output (quad drains) the IF-output role
  if_output_negative: RF_N
  supply_positive: VDD
external_bias:
  VSS:       {kind: voltage, value: 0.0, provenance: "rule G3: DUT ground pin without a family role, held at 0 V"}
  TAIL_BIAS: {kind: voltage, value: 0.865, provenance: "rule D7: tail T6 gate voltage re-chosen by simulation for the thesis's 2 mA tail current (PDF 89) in sky130 (thesis 465 mV, Fig. 4.12, leaves the sky130 tail nearly off); sizing variable V_TAIL"}
op_check:
  exclude: []
  note: "All seven devices are meant to be saturated at the quiescent point (thesis 4.3.2-4.3.3, PDF 88-90: tail, baseband pair and the switching quad checked for saturation); at the DC point both LO pins sit at the LO DC level, so the quad is balanced."
known_issues:
  - "Up-converter in a down-conversion family: the baseband input (20 MHz) is the family's RF input and the quad drains (output at f_LO + f_BB = 5.02 GHz) the IF output; the mixer_*_sb_v1 recipes measure the upper sideband (sideband: +1, owner answer PT4a)."
  - "Single-cell scope (PT1a): the thesis's simulated and measured numbers are for the complete I/Q chip (two cells, CML phase shifter, active balun); the targets are the thesis's single-cell values (hand calculations, sections 4.3.3-4.3.5). Chip-level metrics (I/Q gain 3.74 dB, sideband suppression, output P1dB/OIP3 at 1/2.4 GHz, chip power) are not covered."
  - "Baseband drive AC-coupled (PT3a, recipe setting rf_dc_block_F): the DUT's own divider RP0/RP1 and the 1.03 kOhm resistors RP2/RP3 set the baseband gate DC level."
  - "Supply (rule D7): the thesis chip runs at 2.0 V (above the sky130 1.95 V rating); the task uses 1.8 V, the thesis's hand-design supply (PDF 90) and one of its measured points. The measured supply sweep 1.8/2.0/2.2 V (PDF 119) reports only complete-chip current/power and clock sensitivity, no single-cell metric, so the task has the nominal condition only (rule D3)."
  - "The LO DC level is not given for the single cell (Fig. 4.12 annotations ~1.58-1.69 V at 2 V; hand design minimum 1.0 V): it is the sizing variable V_LO (testbench drive level lo_bias_V), re-chosen by simulation (rule D7)."
  - "Temperature not stated: 27 C (rule G2)."
