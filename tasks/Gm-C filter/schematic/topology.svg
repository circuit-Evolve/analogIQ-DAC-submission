<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="340" viewBox="0 0 1250 340">
<rect width="1250" height="340" fill="white"/>
<g font-family="sans-serif" fill="#172b4d">
<text x="25" y="32" font-size="22">Gm-C reconstructed fourth-order filter — topology overview</text>
<text x="25" y="60" font-size="15">Not paper-exact Fig.3. Each OTA contains the same 32-MOS core; transistor connectivity is in golden_netlist.scs.</text>
<rect x="80" y="110" width="185" height="90" rx="6" fill="#e5efff" stroke="#3569a3"/>
<text x="95" y="142" font-size="18">OTA 1 · 32 MOS</text>
<text x="95" y="168" font-size="14">shared W / L / m</text>
<line x1="265" y1="155" x2="345" y2="155" stroke="#3569a3" stroke-width="2"/>
<text x="85" y="235" font-size="14">C1: differential capacitor</text>
<text x="85" y="258" font-size="14">4 diode-feedback MOS</text>
<rect x="375" y="110" width="185" height="90" rx="6" fill="#e5efff" stroke="#3569a3"/>
<text x="390" y="142" font-size="18">OTA 2 · 32 MOS</text>
<text x="390" y="168" font-size="14">shared W / L / m</text>
<line x1="560" y1="155" x2="640" y2="155" stroke="#3569a3" stroke-width="2"/>
<text x="380" y="235" font-size="14">C2: differential capacitor</text>
<text x="380" y="258" font-size="14">4 diode-feedback MOS</text>
<rect x="670" y="110" width="185" height="90" rx="6" fill="#e5efff" stroke="#3569a3"/>
<text x="685" y="142" font-size="18">OTA 3 · 32 MOS</text>
<text x="685" y="168" font-size="14">shared W / L / m</text>
<line x1="855" y1="155" x2="935" y2="155" stroke="#3569a3" stroke-width="2"/>
<text x="675" y="235" font-size="14">C3: differential capacitor</text>
<text x="675" y="258" font-size="14">4 diode-feedback MOS</text>
<rect x="965" y="110" width="185" height="90" rx="6" fill="#e5efff" stroke="#3569a3"/>
<text x="980" y="142" font-size="18">OTA 4 · 32 MOS</text>
<text x="980" y="168" font-size="14">shared W / L / m</text>
<line x1="1150" y1="155" x2="1230" y2="155" stroke="#3569a3" stroke-width="2"/>
<text x="970" y="235" font-size="14">C4: differential capacitor</text>
<text x="970" y="258" font-size="14">4 diode-feedback MOS</text>
<text x="25" y="310" font-size="15">144 MOS + 4 capacitors. VREF and input common mode = VDD/2; one global VT sizing value across all conditions.</text>
</g></svg>