ports: {input_positive: vinp_I, input_negative: vinn_I, q_input_positive: vinp_Q, q_input_negative: vinn_Q, output: voutp_I_RF, output_negative: voutn_I_RF, q_output: voutp_Q_RF, q_output_negative: voutn_Q_RF,
