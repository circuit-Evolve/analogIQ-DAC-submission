schema_version: 1
topology_id: tinywhisper24_iqmod
family: iq_modulator
interface_type: iq_modulator_fully_differential_baseband
technology_id: sky130
approval_status: unapproved
source:
  doi: none (open-source design; github.com/iic-jku/TinyWhisper commit ad6cbaf, release v2026.08, Zenodo 10.5281/zenodo.22115125)
  title: 'TinyWhisper iqmod_top: IQ modulator (2 x 3rd-order MFB Butterworth LPF, fc 400 kHz, inverter-based OTA; SPDT input switches; 2 passive mixers, 4-phase 25 % LO), S. Dorrer, JKU'
  figure: 'source/Schematics/00_hierarchy.txt and 01_L0_iqmod_top.png (the netlist is the whole iqmod_top hierarchy: 48 device lines in 22 cells, 456 MOSFETs when expanded)'
  netlist_origin: final.scs
  inputs: source/ (README, Metrics.xlsx, Corners.xlsx, schematic images; see source/ORIGIN.txt) and source/repo_ad6cbaf/ (the repository's testbenches, PWM PWL data and coupled-resonator LC band-pass, commit
    ad6cbaf, fetched 2026-10-25)
  modifications: [dut_benchmark.scs = final.scs plus one appended line instantiating the exported top cell once (xiqmod_top ... iqmod_top) so the package has a top level; connectivity and devices unchanged
      (documented export fix)., 'PDK port: IHP SG13G2 130 nm (sg13_lv MOS, rhigh, cap_cmim, VDD 1.5 V) -> sky130 01v8 devices (ideal resistor / capacitor), rule D7; supply kept at 1.5 V (legal).']
