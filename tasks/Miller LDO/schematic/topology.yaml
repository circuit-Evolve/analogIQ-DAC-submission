schema_version: 1
topology_id: ldo24m_miller
family: ldo
interface_type: pmos_pass_ldo
technology_id: gpdk180
approval_status: unapproved
source:
  title: A 0.18um CMOS Internally-Compensated Low-Dropout Voltage Regulator (C. F. Ventura Arizmendi, INAOE MSc thesis, 2014)
  figure: Fig. 4.1 (LDO), Fig. 4.4 (AC test setup, source/testbench.png), Tables 3.2-3.7, 4.2-4.8
  netlist_origin: final.scs
  inputs: source/ (thesis PDF, metrics.xlsx, operating_conditions.xlsx, pvt_corners.xlsx, schematics, testbench.png; see source/ORIGIN.txt)
  modifications:
  - None to final.scs (schemgen export, the uninstantiated subckt repaired_core is the DUT body). Devices are the gpdk180 thick-oxide nmos25/pmos25 (the paper is UMC 0.18 um with 3.3 V devices, supply 2.1-3.3 V); all devices of the netlist are 25 classes, so no device-type swap.
  - Pins VBIAS (gate bias of the NMOS current sources M5/M6/MAB, never given in the paper) and ENABLE (gate of Ms, selects Vout 1.8 V / 1.2 V) are driven by testbench voltage sources.
dut:
  netlist: final.scs
  subckt_name: ldo24m_miller_dut
  port_order:
  - VIN
  - VSS
  - VREF
  - VBIAS
  - ENABLE
  - VOUT
  net_map: {}
ports:
  supply_input: VIN
  output: VOUT
  reference: VREF
external_bias:
  VSS:
    kind: voltage
    value: 0.0
    provenance: 'benchmark rule G3: ground pin without a family role driven by a 0 V source'
  VBIAS:
    kind: voltage
    value: 0.61
    provenance: 'benchmark_default_unreviewed (sizing variable V_BIAS, this is its initial value): gate bias of the NMOS current sources M5 (3.3 uA), M6 (13.1 uA) and MAB (0.5 uA); the paper never gives it (Fig. 3.1 ''VBias not reported''). Chosen by simulation so that the no-load quiescent current is about the paper''s 47 uA (curator_choice_pending_owner_review)'
  ENABLE:
    kind: voltage
    value: 0.0
    provenance: 'paper: p.62 / p.89 (ENABLE low = Ms off = Vout 1.8 V, the nominal mode); the 1.2 V mode (ENABLE = VIN) is the labelled conditions v12 / v12_V33'
probes:
- VFB
- N2
- VG
- NCF
loop_probe:
  instance: M4
  terminal: 1
op_check:
  exclude:
  - MC
  - M7
  - MS
  - MRFB1
  - MRFB2
  - MRFB3
  note: MC is the MOS compensation resistor (triode by design, paper Table 3.2), M7 is at the triode edge at no load (Table 3.2), Ms is the enable switch (off in the nominal mode); the diode-connected feedback PMOS MRFB1-3 are always saturated
known_issues:
- 'loop_probe: gate of M4 (error-amplifier input from the feedback node VFB): breaks the whole regulation loop at a high-impedance point (the paper breaks it at the feedback node with LBIG/CBIG, Fig. 4.4).'
- 'IBIAS-like currents: the error amplifier and current amplifier are biased by the gate voltage VBIAS (no current source in final.scs); the paper''s branch currents (EA 16.4 uA, Table 4.6) are checked against the start values by the reference.'
- 'Paper inconsistencies (thesis): load regulation 0.6 mV/mA (text, Table 4.7) vs 0.714 (Table 4.8); dropout 342 mV (Table 4.7, Fig. 4.3) vs 350 mV (Table 4.8); Vout=1.2 V dropout 534 mV (text) vs 940 mV (Table 4.7); compensation cap Cf 1.5 pF (design) vs <=5 pF (Table 4.8).'
