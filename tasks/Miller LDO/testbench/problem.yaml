description: 'Benchmark task (docs/benchmark_rules.md). Internally compensated capacitor-less PMOS-pass LDO with current-mode Miller compensation
  (gpdk180 thick-oxide devices), as simulated in the thesis: VIN 2.1 V (also 3.3 V), Vout 1.8 V from VREF 1.2 V (ENABLE low), nominal temperature
  60 C (p.93), CL 50 pF, nominal load 70 mA. Conditions: nominal, VIN 3.3 V, Vout=1.2 V mode (ENABLE = VIN) at 2.1 / 3.3 V, and the load-step
  cases of Tables 4.4/4.5 as labelled conditions. Temperature and process corners are only shown as graphs (not targeted). No Monte Carlo reported.
  No objective.'
