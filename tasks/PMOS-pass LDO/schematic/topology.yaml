schema_version: 1
topology_id: ldo24c_conventional
family: ldo
interface_type: pmos_pass_ldo
technology_id: gpdk180
approval_status: unapproved
source:
  title: Design of low-dropout voltage regulator (M. Cermak, CTU Prague master thesis, 2016)
  figure: Fig. 5.3 (final schematic), Fig. A.1 (Cadence schematic with the test setup, source/testbench.png)
  netlist_origin: final.scs
  inputs: source/ (thesis PDF, metrics.xlsx, operating_conditions.xlsx, pvt_corners.xlsx, schematics, testbench.png; see source/ORIGIN.txt)
  modifications:
  - 'dut_benchmark.scs = final.scs (schemgen export, the uninstantiated subckt repaired_core is the DUT body) with the thesis''s real passive components instead of ideal elements (paper_fidelity_2026_10_27; the paper is GPDK180, the same PDK as the netlist). Evidence: thesis Table 5.2 (RFB1/RFB2 W 0.6 um, L 340.85/1363.4 um; RC W 0.3 um, L 15 um; CFF W 62.5 um, L 20 um), Fig. A.1 (instance labels: polyhres, m1res r=500m w=300n l=15u, nmoscap 7p l=20u w=6.25u), Sec. 3.6 (poly-silicon resistors, high-resistance polyhres, nmoscap = NMOS with drain, source and bulk tied) and Table 3.1.'
  - 'RFB1, RFB2: gpdk180_polyhres sl=(R-35)*w/352 (352 ohm/sq sheet resistance, 35 ohm = 25 end + 10 contact resistance of the PDK subckt: the same relation as the pcell, Table 5.2 L 340.85 um for 200 kohm), w 0.6 um fixed (thesis); the resistances R_FB1/R_FB2 stay the sizing variables (dut_parameter bindings). Below 387 ohm (the device at its minimum length 0.6 um) the length clamps.'
  - 'RC (the paper''s 0.5 ohm on-chip series resistor, previously folded into RPAD_RC r=RPAD+0.5): gpdk180_m1res sl=15u w=0.3u (0.01 ohm/sq x 50 sq = 0.5 ohm, tc1 3e-3/K, tc2 -2e-6/K^2 from the PDK model); the pad resistance RPAD (testbench) is a separate ideal resistor in series, RPAD_X. Fixed (the thesis did not size it).'
  - 'CFF: NOT changed (ideal capacitor). The thesis names it a nmoscap (Sec. 3.6.2, Fig. A.1: 7 pF, W 62.5 um, L 20 um; PDK nmoscap = nmos1 with drain = source = bulk). Tried as CFF (VREG VFB VFB VFB) nmos1 w=62.5u l=20u (also bulk on VSS) at the paper sizes: the 0.3 V across it (below Vth) gives only ~2.6 pF (1.8 pF with bulk on VSS), loop PM 33 deg (16 deg) vs 65.1 deg thesis (ideal 7 pF with polyhres: 64), GM 11.8 dB (21.39 thesis), and even C_FF = 100 pF reaches only PM 52 deg (target >= 58.6 deg): the thesis results cannot come from a bias-dependent MOS cap, so its simulation effectively had ~7 pF; the ideal capacitor keeps the thesis behaviour. Open for the owner (onboarding_status paper_fidelity_2026_10_27).'
  - The undeclared symbols RPAD and RESR_VALUE of final.scs are DUT parameters (testbench values, fixed).
  - 'The output capacitor COUT (1 uF) and its ESR RESR are inside final.scs (fixed value): they are the paper''s external output capacitor, so the task load_capacitance_F is 0.'
dut:
  netlist: dut_benchmark.scs
  subckt_name: ldo24c_conventional_dut
  port_order:
  - VIN
  - VSS
  - VREF
  - VOUT
  net_map: {}
ports:
  supply_input: VIN
  output: VOUT
  reference: VREF
external_bias:
  VSS:
    kind: voltage
    value: 0.0
    provenance: 'benchmark rule G3: ground pin without a family role driven by a 0 V source'
dut_parameters:
  RPAD:
    value: 0.2
    provenance: 'paper: Table 5.3 / p.46 (Rpad 0.2-0.5 ohm, test element); nominal value not stated: 0.2 ohm (range minimum) chosen 2026-10-26 (reference_audit_2026_10_26): it reproduces the thesis Fig. 5.10 absolute Vout (1.4992 V at 27 C, 1.1 mA), Fig. 5.14 load step (1.3-1.4 mV) and Table 5.4 PSR at UGBW (57.8 dB); the earlier mid-range 0.35 ohm fitted them less well (notes: docs/benchmark/fix_2026-10-26/check-ldo24c.md)'
  RESR_VALUE:
    value: 0.01
    provenance: 'paper: Fig. A.1 testbench (ESR 10 mohm; Table 5.3 range 10-300 mohm)'
probes:
- VFB
- EAOUT
- VBUF
- TAIL
loop_probe:
  instance: M2
  terminal: 1
op_check:
  exclude: []
  note: 'G8: no exclusions until the reference operating point is inspected (onboarding_status.yaml)'
known_issues:
- 'loop_probe: the gate of M2 (error-amplifier input from the feedback node VFB). It breaks the whole regulation loop (RFB1 and the feed-forward CFF both end on VFB) at a high-impedance point; the paper''s own AC loop analysis (Figs. 5.4/5.5/5.11) is a loop-gain sweep.'
- 'IBIAS (100 nA) is an ideal isource inside final.scs: sizing variable I_BIAS (bias current, instance dc binding). The reference voltage 1.2 V (VREF) is the task''s reference_V (paper: ideal source).'
- On-chip series resistor RPAD_RC = RPAD + 0.5 ohm (paper Rc 0.5 ohm + pad resistance) is a netlist expression, kept fixed.
- 'Dropout: the paper is inconsistent (Table 5.4/6.1 15.6 mV nominal vs text p.48 ''regulation stops below 1.57 V'' = 70 mV); the summary-table value 15.6 mV is the target (G6).'
