description: 'Benchmark task (docs/benchmark_rules.md). Conventional PMOS-pass LDO (NMOS-input OTA, PMOS follower buffer, 10x40/0.18 um pass device,
  1 uF output capacitor), gpdk180, Vout 1.5 V from VREF 1.2 V. Nominal: VIN 1.7 V (testbench Fig. A.1), load 1.1 mA, Cout 1 uF / ESR 10 mohm,
  NN, 27 C (not stated; G2). Conditions: nominal plus the worst-case corners of Table 5.4 as reported (process/Vin/T/load; resistor-corner, Ibias,
  Cout, ESR and Rpad variations are not representable). Targets = the paper''s values with the 10 % tolerance; Monte Carlo output offset from
  Fig. 5.6. No objective.'
source:
  title: Design of low-dropout voltage regulator (M. Cermak, CTU Prague master thesis, 2016)
  figure: Fig. 5.3 (final schematic), Fig. A.1 (Cadence schematic with the test setup, source/testbench.png)
