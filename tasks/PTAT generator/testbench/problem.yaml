description: 'LELOTEMP_BIAS_IBP (wulffern/lelo_temp_sky130a, commit e439fe6): PTAT current generator of the lelo_temp temperature sensor: OTA
  LELOTEMP_OTAR forces V(R1) = V(D1), 8:1 PMOS mirror, 1:8 substrate PNPs, resistor ladder, four cascoded IBP_1U outputs. Tests = the repository''s
  lstb (loop gain, Tian probe -> Spectre stb), tran (power-up) and dc (temperature sweep) testbenches. Targets = the documented simulated results
  (typical, min/max over the 16 process x temperature x supply corners, Monte Carlo mean / sigma from the 3-sigma rows); the repository''s spec
  rows (partly inconsistent, e.g. DC gain min 50 > typ 40) are not used since a result is documented for every metric. The ''model estimate''
  rows of the README (Python model, not simulations) are not targets.'
