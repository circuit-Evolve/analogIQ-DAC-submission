sar:
  # Fixed behavioural SAR logic of the testbench (recipes/sar_ext.py). Bit trials in order after the polarity comparison.
  # split: p/n = [half that starts at the reference and falls, half that starts at 0 and rises]; weights are the
  # integer code weights in units of the smallest weight (1/8 Cu at the low reference VR2 = VR1/8).
  offset_code: 2063
  lsb_reference_fraction: 4.734848484848485e-4   # (1/8 Cu) / (264 Cu): the nominal LSB as a fraction of VR1
  trials:
    - {name: CP11, kind: split, p: [BP_CP11a, BP_CP11b], n: [BP_CN11a, BP_CN11b], reference: high, weight: 1024}
    - {name: CP10, kind: split, p: [BP_CP10a, BP_CP10b], n: [BP_CN10a, BP_CN10b], reference: high, weight: 512}
    - {name: CP9, kind: split, p: [BP_CP9a, BP_CP9b], n: [BP_CN9a, BP_CN9b], reference: high, weight: 256}
    - {name: CP8, kind: split, p: [BP_CP8a, BP_CP8b], n: [BP_CN8a, BP_CN8b], reference: high, weight: 128}
    - {name: CP7, kind: split, p: [BP_CP7a, BP_CP7b], n: [BP_CN7a, BP_CN7b], reference: high, weight: 64}
    - {name: CP6, kind: split, p: [BP_CP6a, BP_CP6b], n: [BP_CN6a, BP_CN6b], reference: high, weight: 32}
    - {name: CP5c, kind: split, p: [BP_CP5ac, BP_CP5bc], n: [BP_CN5ac, BP_CN5bc], reference: high, weight: 16}
    - {name: CP5, kind: split, p: [BP_CP5a, BP_CP5b], n: [BP_CN5a, BP_CN5b], reference: high, weight: 16}
    - {name: CP4, kind: single, p: [BP_CP4], n: [BP_CN4], reference: high, weight: 8}
    - {name: CP3, kind: single, p: [BP_CP3], n: [BP_CN3], reference: low, weight: 4}
    - {name: CP2, kind: single, p: [BP_CP2], n: [BP_CN2], reference: low, weight: 2}
    - {name: CP1, kind: single, p: [BP_CP1], n: [BP_CN1], reference: low, weight: 1}
known_issues:
  - "VXP_MSB / VXP_MID (and the N side) are separate top-plate pins in the netlist: the resolution switches RSP1/RSP2 are not in it; the 12-bit mode (all switches on) is modelled by 10 ohm resistors tying them to VXP / VXN."
  - "The comparator's latch devices (MPH_*, MNR_*, MPL_*, MNL_*, MND_*, MP_/MN_COP/CON) have 1 um / 1 um placeholder sizes in the netlist (paper: not reported)."
