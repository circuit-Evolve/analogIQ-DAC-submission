approval_status: unapproved
source:
  doi: 10.1109/TCSII.2025.3541236
  title: "An 8-to-12-Bit Resolution-Reconfigurable SAR ADC With Fast-Window-Switching Technique (Liang, Song, Zhu, TCAS-II 2025)"
  figure: "Fig. 7 (CDAC architecture), Fig. 11 (dynamic comparator)"
  netlist_origin: final.scs
  modifications:
    - "None to final.scs. The netlist is the analog core only (dual-reference differential CDAC capacitors + dynamic comparator with SR latch). Bootstrap switches, resolution switches RSP/RSN, reference switches and the SAR/FWS logic are NOT in the netlist: the testbench adds them as fixed behavioural instrumentation (Verilog-A sequencer, recipes/sar_ext.py)."

