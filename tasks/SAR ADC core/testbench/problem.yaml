description: 'Benchmark task (docs/benchmark_rules.md). Analog core (dual-reference differential CDAC capacitors + dynamic comparator with SR
  latch) of the 8-to-12-bit resolution-reconfigurable SAR ADC with Fast-Window-Switching of Liang et al. (TCAS-II 2025), gpdk180. The netlist
  holds NO switches and NO logic: the testbench adds fixed behavioural instrumentation (Verilog-A sequencer: ideal sampling switch 10 ohm, resolution
  switches closed = 12-bit mode, comparator clock, bottom-plate drivers, FWS bit-trial logic applied to all bits) so that the ADC metrics can
  be measured; only the analog sizes vary. 12-bit mode only (the netlist''s 264-unit CDAC). Nominal condition only (the paper reports no PVT:
  NN (typical), 27 C, 1.8 V). Dynamic test: 256 coherent conversions at 10 MS/s, 123 input cycles (fin = 4.805 MHz, paper 4.8 MHz; paper FFT 16384
  points), differential amplitude +-1.70 V at 0.9 V common mode, noiseless. Static test: 40-point ramp plus 12 code-transition pairs. Targets
  = the paper''s 12-bit mode values (measured chip values; the paper''s only simulated ADC-level numbers are behavioural), each with the 10 %
  tolerance.'
source:
  doi: 10.1109/TCSII.2025.3541236
  title: An 8-to-12-Bit Resolution-Reconfigurable SAR ADC With Fast-Window-Switching Technique (Liang, Song, Zhu, TCAS-II 2025)
  figure: Fig. 7 (CDAC architecture), Fig. 11 (dynamic comparator)
