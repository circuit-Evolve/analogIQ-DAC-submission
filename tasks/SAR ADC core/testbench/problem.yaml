  aggregate: worst case over all conditions and matching points
  provenance: 'paper Fig. 14 (12-bit power breakdown: CDAC 42.1 % + comparator 20.7 % = 62.8 % of the 580 uW of Table II / abstract = 364 uW);
    measured here: comparator supply + reference energy of the CDAC drivers = exactly those two blocks (switches 12.9 % and logic 24.3 % are ideal
    Verilog-A here). consolidation_2026_10_27 (G6 step 2, like-for-like): was 580 uW (the whole chip incl. logic and switches, 60 % looser than
    the quantity measured; the earlier owner decision Q2d to keep 580 is corrected with this evidence)'
