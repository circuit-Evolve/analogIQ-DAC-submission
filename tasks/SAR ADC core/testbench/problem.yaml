    kind: power_db
    paper_value: 79.6
    bound: lower
    tolerance_pct: 10.0
  conditions:
  - nominal
  aggregate: worst case over all conditions and matching points
  provenance: 'paper Table II / abstract: SFDR 79.6 dB, 12-bit mode (measured, 16384-point FFT). consolidation_2026_10_27: our FFT is 256 points
    (was 64): the SFDR of an ideal 12-bit quantiser at this amplitude is 84.4 dB (83.2-85.7) at 256 points against 98 dB at 16384 and 78.7 (77.0-80.2)
    at 64, so with 64 points the target was decided by the quantiser spur pattern; at 256 points the target is above the quantiser limit and reflects
    distortion'
