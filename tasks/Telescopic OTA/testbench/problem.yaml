description: 'Benchmark task (docs/benchmark_rules.md). Two-stage telescopic OTA with Miller (CC + RZ) compensation (Soman et al., ICNWC 2023,
  Fig. 2/4), gpdk180, 1.8 V, CL 1 pF, unity-gain follower at 0.9 V input common mode. Conditions: nominal (TT 27 C) plus Table V''s four corners
  (SS/FF at 0 and 100 C; gain, UGF, PM only). Targets are Table IV''s values (10 % linear tolerance), each only where the paper reports it. No
  Monte Carlo (the paper reports none). No objective.'
