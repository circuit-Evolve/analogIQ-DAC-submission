  title: 'Soman, Gandhi, Baskaran M.: Analysis and Design of a Two stage Telescopic OTA using SCL 180nm CMOS Technology (ICNWC 2023)'
  figure: 'Fig. 2 (p.2) / Fig. 4 (p.5, operating-point schematic): telescopic first stage (M1/M2, cascodes M11/M12 and M9/M10, mirror M3/M4, tail
    M5) and PMOS common-source second stage M8 with sink M7, CC + RZ Miller compensation'
