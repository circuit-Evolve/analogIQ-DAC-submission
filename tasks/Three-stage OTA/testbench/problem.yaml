interfaces:
  evaluate_command:
  - <ANALOGIQ>/.venv/bin/python
  - -m
  - analogiq
  - size-eval
  - --task
  - ota3s24_task_001
  - --design
  - '{design_json}'
  - --out
  - '{out_dir}'
  evaluate_output: '{out_dir}/metrics.json (schema analogiq.sizing_metrics/1); full record {out_dir}/result.json'
  python: from analogiq.sizing import SizingProblem; SizingProblem('ota3s24_task_001').evaluate(design, out_dir)
  deck_run: spectre -64 +escchars =log spectre.log -format psfascii -raw raw input.scs   (in a job folder)
  deck_extract:
  - <ANALOGIQ>/.venv/bin/python
  - -m
  - analogiq
  - extract
  - --job
  - '{job_folder}'
  design_slots: 'template.scs: {{VAR}} on the XDUT line (DUT variables) and on the testbench ''parameters'' line (external-bias variables); values
    in SI units'
  working_directory: <ANALOGIQ>
