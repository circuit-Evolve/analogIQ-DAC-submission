      quiescent point); the settling step is centred at 0.6 V (0.4 -> 0.8 V), see recipes.amp30_step_v1'
  load_capacitance_F:
    value: 5.0e-10
    provenance: 'paper: Fig. 5 / Table 2 mid column CL = 500 pF (the nominal condition); each labelled condition overrides it with its own CL
      (operating load_capacitance_F); the load is the fixture''s capacitor out -> ground (dut_benchmark.scs has no CL)'
constraints:
- name: open_loop_gain_dB
  metric: open_loop_gain_dB
  recipe: amp_ol_v1
  point: {}
  unit: dB
  lower: 118.3848501887865
  target:
    kind: voltage_db
    paper_value: 119.3
    bound: lower
    tolerance_pct: 10.0
  conditions:
  - nominal
  aggregate: worst case over all conditions and matching points
  provenance: 'paper: BelghisAzar, Trans. Machine Intelligence 7(4) 2024, abstract, p. 291 and Table 2 (A0 119.3 dB, ''peak value'' over CL =
    0 .. 100 nF; text: ''DC gain exceeding 100 dB''). Gain is independent of CL below the dominant pole (Fig. 4: all curves coincide up to ~100
    Hz), so it is targeted once, at the nominal condition (CL = 500 pF, Table 2 / Fig. 5 mid column), read at 1 Hz. Open loop: the DC loop of
    the unity-gain buffer is closed through an ideal 1e18 H inductor (input common mode 0.45 V, p. 291), AC injected into the inverting input;
    CL is the fixture capacitor to ground.'
  source: measure
- name: supply_current_A
  metric: supply_current_A
  recipe: amp_dc_v1
  point: {}
  unit: A
  upper: 2.5718e-05
  target:
    kind: linear
    paper_value: 2.338e-05
    bound: upper
    tolerance_pct: 10.0
  conditions:
  - nominal
  aggregate: worst case over all conditions and matching points
  provenance: 'paper: BelghisAzar, Trans. Machine Intelligence 7(4) 2024, abstract and p. 290 ''current consumption is 23.38 uA'' (Table 2: 23.4
    uA, same value rounded); VDD = 1.8 V. Supply current of the DUT at the quiescent point of the buffer (input 0.45 V), independent of CL. The
    paper gives no power; power = 1.8 V x IDD (42.1 uW) is derived, so the primary reported quantity (IDD) is the target (upper bound).'
  source: measure
