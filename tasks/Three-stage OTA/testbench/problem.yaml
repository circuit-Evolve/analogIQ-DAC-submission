description: 'Benchmark task (docs/benchmark_rules.md). Three-stage OTA with current-buffer (common-gate M3a/M3b) Miller compensation Cc1/Cc2,
  an RD-CD impedance-attenuation branch and a feed-forward class-AB output stage (BelghisAzar, Transactions on Machine Intelligence 7(4), 2024,
  Figs. 1-2, Table 1), gpdk180, VDD 1.8 V, the three bias voltages VB1-VB3 are sizing variables. Conditions = the paper''s load capacitors where
  it reports a number: CL = 0, 100 pF, 500 pF (nominal: Table 2 mid column, Fig. 5), 50 nF and 100 nF (Figs. 4-6, Table 2), process NN 27 C (the
  paper gives no corner / temperature values: Fig. 5 is a plot with unnamed corners). Targets are the paper''s printed values (A0, unity-gain
  frequency / GBW, 1 % settling, slew rate, supply current, total compensation capacitance) with the 10 % tolerance; definitions follow the paper
  (docs/benchmark/definition_audit/ota3s24_task_001.yaml). No Monte Carlo (the paper reports none). No objective.'
