    and a value independent of CL at 100 nF, which Table 2 contradicts), measured as unity_gain_frequency_Hz. Open loop: the DC loop of the unity-gain
    buffer is closed through an ideal 1e18 H inductor (input common mode 0.45 V, p. 291), AC injected into the inverting input; CL is the fixture
    capacitor to ground.'
  source: measure
