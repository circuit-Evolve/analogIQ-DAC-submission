description: 'Benchmark task (docs/benchmark_rules.md). Wideband shunt-feedback TIA with capacitive feedback and a negative-capacitance generator
  (paper Fig. 4) at the paper''s conditions (1.8 V, 27 C, TT, Cpd 50 fF) plus exactly the paper''s one-at-a-time variations: process corners SS/FS/SF/FF
  (Fig. 14), temperature 54/81/108 C (Fig. 8), supply 1.6/1.4/1.2 V (Fig. 9) and photodiode capacitance 100/150/200 fF (Fig. 7). Targets are the
  paper''s values with 10 % linear tolerance, each where the paper reports it. User-approved 15% tolerance, 2026-11-12; validity limits unchanged.'
source:
  doi: 10.1007/s10470-018-1246-x
  title: Wideband transimpedance amplifier using negative capacitance and capacitive feedback (Singh, Gupta, Bansal; Analog Integr. Circ. Sig.
    Process. 97:269-279, 2018)
  figure: Fig. 4 (shunt-feedback CS TIA M1/RF/CF with PMOS mirror load M2/M3 fed by Ibias2, followed by the negative-capacitance generator M4/M5
    (tail Ibias1), diode load M6 and capacitor C from VY to Vout)
