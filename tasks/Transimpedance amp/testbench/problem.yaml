    step 1 (consolidation 2026-10-27): the value the paper''s own data support is 1.8 V x 0.81 mA = 1.458 mW (upper bound; 10 % tolerance 1.60
    mW). Before: 0.81 mW (owner TI7a, the table value), which needs about half the bias current of Table 1'
  source: measure
