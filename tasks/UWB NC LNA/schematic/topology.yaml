source:
  doi: 10.22075/jme.2023.28966.2361
  title: "A Low Power CMOS UWB LNA with Sub-1V Supply Voltage and Noise Cancellation Technique (J. Modeling in Engineering 22(77), 2024)"
  figure: "p. 5 schematic (common-gate M1 + noise-cancelling common-source M2/M4, gm-boosting C1/C2, output buffer M3); Table 1 sizing (schematic)"
  netlist_origin: final.scs
  inputs: "source/ (paper PDF, schematic, metrics_sizing.xlsx, operating_conditions.xlsx, pvt_corners.xlsx; see source/ORIGIN.txt)"
  technology_check: "Paper: TSMC 0.18 um RF-CMOS, 0.8 V core (abstract, p. 7). Netlist: gpdk180 nmos1 (same node; 0.8 V < 1.98 V rating). No mismatch."
  modifications:
    - "paper_fidelity_2026_10_27 (real components): dut_benchmark.scs = final.scs with C1, C2 and C3 as the PDK's gpdk180 `mimcap` (paper Table 1: 'MIM', C1 = C3 = 20.28 fF Lt = Wt = 4 um, C2 = 951 fF 30 x 30 um). The paper's capacitance values are kept (the paper's process is TSMC 0.18 um RF-CMOS: its 4 x 4 um plate gives 20.28 fF, the PDK mimcap model 17.6 fF; the plate is a square computed from the capacitance variables C_GB1 / C_GB2 / C_FB (initial = the paper values: side 4.40 um / 30.9 um; the PDK model's cj 1 fF/um2 + cjsw 0.1 fF/um). Adds the model's tc1 9e-4/K and 1 % mismatch. The spiral inductors L1-L3 (Table 1: 'Spiral-sym', nr = 2/4/2, rad 81-94 um) stay ideal: gpdk180 has no inductor model (the PDK inductor is an ideal Spectre inductor) and the paper states neither Q nor series resistance. CIN, C4 (type not stated) stay ideal."
    - "None to final.scs otherwise. Its 11 unvalued element parameters (CIN, LIN, L0, L4, L5, C4, R1, RB1, RB2, RL1, RL2: '<name>_value') are bound to sizing variables (the paper gives none of them; Table 1 lists only M1-M4, L1-L3, C1-C3)."
