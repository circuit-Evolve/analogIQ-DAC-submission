description: 'Benchmark task (docs/benchmark_rules.md). UWB noise-cancelling LNA over the paper''s 2-12 GHz band at a single 0.8 V supply (NC1a),
  50-ohm ports, gpdk180 NN, 27 C (schematic results: abstract / Table 4), plus the paper''s Table 3 process/temperature corners (FF/SS at -20
  C and 85 C, SF at -20 C, 0.8 V), where only S21 and NF are reported (FS/-20, FS/85, SF/85 not targeted, rule G6 step 4: they contradict the
  all-NMOS design''s FF/SS rows). IIP3 at 7.4 GHz (two tones 7.4 / 7.48 GHz). Stability k / mu > 1 over the band (NC3a). Targets are the paper''s
  values with 10 % linear tolerance; this task replaces nclna01_task_001 + nclna01_task_002_corners.'
